services:
  db:
    image: postgres:16-alpine
    container_name: tallypns-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tallypns
    volumes:
      - tallypns_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tallypns"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tallypns_pgdata:
