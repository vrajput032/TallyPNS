name: Daily payment reminders

on:
  schedule:
    # 05:30 UTC = 11:00 AM IST. GitHub may start scheduled runs a few minutes late.
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Resend even if today's reminder already went out"
        type: boolean
        default: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_URL: https://tallypns-api.onrender.com
    steps:
      - name: Wake the API (Render free plan sleeps when idle)
        run: curl --silent --show-error --fail --retry 6 --retry-all-errors --retry-delay 20 --max-time 90 "$API_URL/health"

      - name: Send reminders
        env:
          CRON_SECRET: ${{ secrets.NOTIFICATIONS_CRON_SECRET }}
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Add the NOTIFICATIONS_CRON_SECRET repository secret"
            exit 1
          fi
          curl --silent --show-error --fail-with-body --retry 3 --retry-all-errors --retry-delay 30 --max-time 120 \
            -X POST -H "X-Notifications-Cron-Secret: $CRON_SECRET" \
            "$API_URL/api/notifications/cron?force=$FORCE"
